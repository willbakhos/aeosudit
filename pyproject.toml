[project]
name = "aeo-audit"
version = "0.1.0"
description = "Audit how a website appears across AI answer engines."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "tqdm>=4.66",
]

[project.scripts]
aeo-audit = "src.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
